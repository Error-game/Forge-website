<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FORGE</title>
  <link rel="icon" type="image/jpeg" href="forge-logo.jpeg">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="main-header">
    <div class="header-container">
      <div class="logo-container">
        <a href="index.html">
          <img src="forge-logo.jpeg" alt="FORGE Logo" class="logo">
        </a>
      </div>
    </div>
  </header>

  <section class="auth-section">
    <div class="auth-container">
      <h1>Create Account</h1>
      <p>Join the FORGE community</p>
      
      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="register-name">Full Name</label>
          <input type="text" id="register-name" name="name" required>
        </div>

        <div class="form-group">
          <label for="register-email">Email Address</label>
          <input type="email" id="register-email" name="email" required>
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" name="password" required>
        </div>

        <div class="form-group">
          <label for="register-confirm">Confirm Password</label>
          <input type="password" id="register-confirm" name="confirm" required>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" name="terms" required>
            <span>I agree to the <a href="terms.html">Terms & Conditions</a></span>
          </label>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
      </form>

      <p class="auth-link">Already have an account? <a href="login.html">Sign in here</a></p>
    </div>
  </section>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const password = document.getElementById('register-password').value;
      const confirm = document.getElementById('register-confirm').value;
      if (password !== confirm) {
        alert('Passwords do not match');
        return;
      }
      alert('Registration functionality will be connected to backend');
    });
  </script>
</body>
</html>
