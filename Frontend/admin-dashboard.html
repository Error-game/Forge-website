<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - FORGE</title>
  <link rel="icon" type="image/jpeg" href="forge-favicon.jpeg">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 1400px;
      margin: 40px auto;
      padding: 20px;
    }
    
    .stats-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .stat-card {
      background: var(--dark-gray);
      border: 2px solid var(--primary-white);
      padding: 25px;
      text-align: center;
    }
    
    .stat-card h3 {
      font-size: 2.5rem;
      color: var(--primary-white);
      margin-bottom: 10px;
    }
    
    .stat-card p {
      color: var(--light-gray);
      font-size: 1rem;
    }
    
    .filters {
      background: var(--dark-gray);
      padding: 20px;
      margin-bottom: 20px;
      border: 2px solid var(--border-gray);
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    
    .filter-group {
      flex: 1;
      min-width: 200px;
    }
    
    .orders-table {
      background: var(--primary-white);
      border: 2px solid var(--primary-black);
      overflow-x: auto;
    }
    
    .orders-table table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .orders-table thead {
      background: var(--primary-black);
      color: var(--primary-white);
    }
    
    .orders-table th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      border-bottom: none;
    }
    
    .orders-table td {
      padding: 15px;
      border-bottom: 1px solid var(--border-gray);
      color: var(--primary-black);
    }
    
    .orders-table tbody tr:hover {
      background: var(--light-gray);
    }
    
    .status-badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-block;
    }
    
    .status-pending {
      background: #ffd700;
      color: #000;
    }
    
    .status-confirmed {
      background: #4CAF50;
      color: white;
    }
    
    .status-preparing {
      background: #2196F3;
      color: white;
    }
    
    .status-delivered {
      background: #9C27B0;
      color: white;
    }
    
    .status-paid {
      background: #00C853;
      color: white;
    }
    
    .status-unpaid {
      background: #FF5722;
      color: white;
    }
    
    .action-btns {
      display: flex;
      gap: 5px;
    }
    
    .btn-small {
      padding: 5px 10px;
      font-size: 0.85rem;
      background: var(--primary-black);
      color: var(--primary-white);
      border: 1px solid var(--primary-black);
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-small:hover {
      background: var(--primary-white);
      color: var(--primary-black);
    }
    
    .order-details-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 9999;
      padding: 20px;
      overflow-y: auto;
    }
    
    .modal-content {
      background: var(--primary-white);
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      border: 3px solid var(--primary-black);
      color: var(--primary-black);
    }
    
    .modal-close {
      float: right;
      font-size: 2rem;
      cursor: pointer;
      color: var(--primary-black);
    }
    
    @media (max-width: 768px) {
      .stats-cards {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .filters {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="top-logo-section">
    <a href="index.html">
      <img src="forge-logo.jpeg" alt="FORGE Logo" class="centered-logo">
    </a>
  </div>

  <header class="main-header">
    <div class="header-container">
      <nav class="desktop-nav">
        <ul>
          <li><a href="admin-dashboard.html" class="active">Dashboard</a></li>
          <li><a href="admin-orders.html">Orders</a></li>
          <li><a href="admin-customers.html">Customers</a></li>
          <li><a href="index.html">View Site</a></li>
        </ul>
      </nav>
      <div class="user-section">
        <div class="welcome-text">Admin Panel</div>
        <div class="user-profile-circle" onclick="logout()">
          <svg class="default-user-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
          </svg>
        </div>
      </div>
    </div>
  </header>

  <div class="admin-container">
    <h1>Admin Dashboard</h1>
    
    <!-- Stats Cards -->
    <div class="stats-cards">
      <div class="stat-card">
        <h3 id="totalOrders">0</h3>
        <p>Total Orders</p>
      </div>
      <div class="stat-card">
        <h3 id="pendingOrders">0</h3>
        <p>Pending Orders</p>
      </div>
      <div class="stat-card">
        <h3 id="unpaidOrders">0</h3>
        <p>Unpaid Orders</p>
      </div>
      <div class="stat-card">
        <h3 id="totalRevenue">$0</h3>
        <p>Total Revenue</p>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <div class="filter-group">
        <label>Filter by Status:</label>
        <select id="statusFilter" onchange="filterOrders()">
          <option value="all">All Orders</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="preparing">Preparing</option>
          <option value="delivered">Delivered</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label>Filter by Payment:</label>
        <select id="paymentFilter" onchange="filterOrders()">
          <option value="all">All</option>
          <option value="paid">Paid</option>
          <option value="unpaid">Unpaid</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label>Filter by Plan:</label>
        <select id="planFilter" onchange="filterOrders()">
          <option value="all">All Plans</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>
    </div>

    <!-- Orders Table -->
    <div class="orders-table">
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Plan</th>
            <th>Payment Method</th>
            <th>Status</th>
            <th>Payment</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody">
          <tr>
            <td colspan="8" style="text-align: center; padding: 40px;">Loading orders...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Order Details Modal -->
  <div class="order-details-modal" id="orderModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    let allOrders = [];

    // Load orders from backend
    async function loadOrders() {
      try {
        const response = await fetch('http://localhost:3000/admin/orders');
        const data = await response.json();
        allOrders = data.orders || [];
        updateStats();
        displayOrders(allOrders);
      } catch (error) {
        console.error('Error loading orders:', error);
        document.getElementById('ordersTableBody').innerHTML = 
          '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #000;">No orders yet or server not running</td></tr>';
      }
    }

    function updateStats() {
      const pending = allOrders.filter(o => o.status === 'pending').length;
      const unpaid = allOrders.filter(o => o.payment_status === 'unpaid').length;
      
      const prices = { daily: 18, weekly: 119, monthly: 480 };
      const revenue = allOrders
        .filter(o => o.payment_status === 'paid')
        .reduce((sum, o) => sum + (prices[o.plan] || 0), 0);

      document.getElementById('totalOrders').textContent = allOrders.length;
      document.getElementById('pendingOrders').textContent = pending;
      document.getElementById('unpaidOrders').textContent = unpaid;
      document.getElementById('totalRevenue').textContent = '$' + revenue;
    }

    function displayOrders(orders) {
      const tbody = document.getElementById('ordersTableBody');
      
      if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #000;">No orders found</td></tr>';
        return;
      }

      tbody.innerHTML = orders.map(order => `
        <tr>
          <td><strong>#${order.id}</strong></td>
          <td>${order.name}<br><small>${order.email}</small></td>
          <td>${capitalizeFirst(order.plan)}</td>
          <td>${order.payment_method === 'cash' ? 'Cash' : 'Card'}</td>
          <td><span class="status-badge status-${order.status || 'pending'}">${capitalizeFirst(order.status || 'pending')}</span></td>
          <td><span class="status-badge status-${order.payment_status || 'unpaid'}">${capitalizeFirst(order.payment_status || 'unpaid')}</span></td>
          <td>${new Date(order.created_at).toLocaleDateString()}</td>
          <td class="action-btns">
            <button class="btn-small" onclick="viewOrder(${order.id})">View</button>
            <button class="btn-small" onclick="updateStatus(${order.id})">Update</button>
          </td>
        </tr>
      `).join('');
    }

    function filterOrders() {
      const statusFilter = document.getElementById('statusFilter').value;
      const paymentFilter = document.getElementById('paymentFilter').value;
      const planFilter = document.getElementById('planFilter').value;

      let filtered = allOrders;

      if (statusFilter !== 'all') {
        filtered = filtered.filter(o => o.status === statusFilter);
      }
      if (paymentFilter !== 'all') {
        filtered = filtered.filter(o => o.payment_status === paymentFilter);
      }
      if (planFilter !== 'all') {
        filtered = filtered.filter(o => o.plan === planFilter);
      }

      displayOrders(filtered);
    }

    function viewOrder(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;

      const prices = { daily: 18, weekly: 119, monthly: 480 };
      const price = prices[order.plan] || 0;

      const content = `
        <h2>Order #${order.id}</h2>
        <hr style="margin: 20px 0; border-color: #000;">
        
        <h3>Customer Information</h3>
        <p><strong>Name:</strong> ${order.name}</p>
        <p><strong>Email:</strong> ${order.email}</p>
        <p><strong>Phone:</strong> ${order.phone}</p>
        <p><strong>Address:</strong> ${order.address}</p>
        
        <h3 style="margin-top: 20px;">Order Details</h3>
        <p><strong>Plan:</strong> ${capitalizeFirst(order.plan)}</p>
        <p><strong>Price:</strong> $${price}</p>
        <p><strong>Payment Method:</strong> ${order.payment_method === 'cash' ? 'Cash' : 'Card'}</p>
        <p><strong>Status:</strong> <span class="status-badge status-${order.status || 'pending'}">${capitalizeFirst(order.status || 'pending')}</span></p>
        <p><strong>Payment:</strong> <span class="status-badge status-${order.payment_status || 'unpaid'}">${capitalizeFirst(order.payment_status || 'unpaid')}</span></p>
        <p><strong>Order Date:</strong> ${new Date(order.created_at).toLocaleString()}</p>
        
        <div style="margin-top: 30px;">
          <button class="btn-submit" onclick="markAsPaid(${order.id})">Mark as Paid</button>
          <button class="btn-submit" onclick="sendEmail(${order.id})">Send Email</button>
        </div>
      `;

      document.getElementById('modalContent').innerHTML = content;
      document.getElementById('orderModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('orderModal').style.display = 'none';
    }

    async function updateStatus(orderId) {
      const newStatus = prompt('Enter new status (pending/confirmed/preparing/delivered):');
      if (!newStatus) return;

      try {
        const response = await fetch(`http://localhost:3000/admin/orders/${orderId}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });

        if (response.ok) {
          alert('Status updated!');
          loadOrders();
        }
      } catch (error) {
        console.error('Error updating status:', error);
      }
    }

    async function markAsPaid(orderId) {
      try {
        const response = await fetch(`http://localhost:3000/admin/orders/${orderId}/payment`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payment_status: 'paid' })
        });

        if (response.ok) {
          alert('Marked as paid!');
          closeModal();
          loadOrders();
        }
      } catch (error) {
        console.error('Error marking as paid:', error);
      }
    }

    function sendEmail(orderId) {
      alert('Email functionality will send order confirmation to customer');
    }

    function capitalizeFirst(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // Load orders on page load
    loadOrders();
    setInterval(loadOrders, 30000); // Refresh every 30 seconds
  </script>
</body>
</html>
