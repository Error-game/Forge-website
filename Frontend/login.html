<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FORGE</title>
  <link rel="icon" type="image/jpeg" href="forge-logo.jpeg">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="main-header">
    <div class="header-container">
      <div class="logo-container">
        <a href="index.html">
          <img src="forge-logo.jpeg" alt="FORGE Logo" class="logo">
        </a>
      </div>
    </div>
  </header>

  <section class="auth-section">
    <div class="auth-container">
      <h1>Welcome Back</h1>
      <p>Sign in to your FORGE account</p>
      
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
      <p class="auth-link"><a href="#">Forgot password?</a></p>
    </div>
  </section>

  <script src="script.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      
      // For demo purposes - in production, verify against backend
      // Extract name from email
      const name = email.split('@')[0].replace(/[._]/g, ' ');
      const capitalizedName = name.split(' ').map(word => 
        word.charAt(0).toUpperCase() + word.slice(1)
      ).join(' ');
      
      // Generate avatar URL based on name
      const photoURL = `https://ui-avatars.com/api/?name=${encodeURIComponent(capitalizedName)}&background=ffffff&color=000000&size=200&bold=true`;
      
      // Store user data
      const userData = {
        name: capitalizedName,
        email: email,
        photoURL: photoURL
      };
      
      localStorage.setItem('forgeUser', JSON.stringify(userData));
      
      alert('Login successful! Redirecting to home page...');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
